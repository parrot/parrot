name: Github CI
on:
  pull_request:
  push:
    branches:
      - master
      - smoke-me/*
    tags:
      - 'RELEASE_*_*_*'
    paths-ignore:
      - README.md
      - LICENSE
      - ChangeLog
      - CREDITS
      - DEVELOPING
      - MANIFEST
      - MANIFEST.SKIP
      - PLATFORMS
      - RESPONSIBLE_PARTIES
      - TODO
      - editor/**
      - '*.pod'
      - '*/*.pod'

#concurrency:
#  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Known, documented leaks, see the file for the reasons. The suppressions
      # match on the caller frames, so the asan build keeps frame pointers
      # (Configure.pl adds -fno-omit-frame-pointer for -fsanitize=address).
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/dev/lsan.supp:print_suppressions=0
    strategy:
      fail-fast: false
      matrix:
        CONFIGURE_ARGS:
          -
          - --optimize
          - --debugging
          - --optimize --cc=clang --ld=clang --link=clang
          - --optimize --cc="g++ -fPIE" --ld="g++ -fPIE" --link="g++ -fPIE"
          - --debugging --ccflags="-O1 -fsanitize=address -fPIE" --linkflags="-fsanitize=address -fPIE" --ldflags="-fsanitize=address"
    steps:
    - name: checkout
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        fetch-depth: 1
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
      with:
        create-symlink: true
        key: ${{ github.job }}-${{ matrix.CONFIGURE_ARGS }}
    - if: ${{ matrix.CONFIGURE_ARGS == '--optimize' }}
      name: install cpan deps
      uses: perl-actions/install-with-cpm@8b1a9840b26cc3885ae2889749a48629be2501b0 # v1.9
      with:
        install: |
          Pod::Find
          Test::Perl::Critic
    - run: perl Configure.pl ${{ matrix.CONFIGURE_ARGS }}
    - run: make -j -s
    - if: ${{ matrix.CONFIGURE_ARGS != '--optimize' }}
      run: make -j -s test
    - if: ${{ matrix.CONFIGURE_ARGS == '--optimize' }}
      run: make -j -s fulltest
